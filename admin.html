<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Nexa | Admin Panel</title>
<style>
:root{--bg:#050608;--panel:#0d1015;--line:#252b35;--text:#f5f7fa;--muted:#9299a6;--gold:#f4b400;--green:#25d366}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{width:min(1000px,94%);margin:35px auto}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.brand{font-weight:900;font-size:22px}.brand span{color:var(--gold)}.panel{background:linear-gradient(145deg,#11151b,#090b0f);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.field{width:100%;background:#080b0f;color:#fff;border:1px solid #303743;border-radius:9px;padding:11px;margin:6px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:#08090b}.danger{background:#260d0d;color:#ff9999;border:1px solid #512020}.status{color:var(--muted);font-size:12px;min-height:20px}.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row img{width:55px;height:55px;object-fit:cover;border-radius:8px;background:#15191f}.row span{flex:1}.login{max-width:430px;margin:12vh auto}.small{color:var(--muted);font-size:12px;line-height:1.6}.hide{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.row{align-items:flex-start}.row .danger{padding:9px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="login" class="login panel">
<div class="brand">SHOP <span>NEXA</span></div><h2>Admin Access</h2>
<p class="small">Enter the Shop Nexa admin code to manage products.</p>
<input id="code" class="field" type="password" placeholder="Admin code" onkeydown="if(event.key==='Enter')unlock()">
<button class="btn primary" onclick="unlock()">OPEN ADMIN PANEL</button><div id="loginStatus" class="status"></div>
</div>
<div id="app" class="wrap hide">
<div class="head"><div><div class="brand">SHOP <span>NEXA</span> ADMIN</div><div class="small">Add, view and remove products.</div></div><a class="btn" style="background:#11151a;color:#fff;border:1px solid var(--line)" href="./">← Store</a></div>
<div class="panel"><h2>Add Product</h2>
<div class="grid"><div><label>Product name</label><input id="name" class="field" placeholder="e.g. Redington Airbuds Pro 2"></div><div><label>Price (PKR)</label><input id="price" class="field" type="number" placeholder="640"></div><div><label>Category</label><select id="category" class="field"><option>Airbuds</option><option>Chargers</option><option>Data Cables</option><option>Mini Speakers</option><option>Mobile Accessories</option><option>Power Banks</option></select></div><div><label>Video (optional)</label><input id="video" class="field" type="file" accept="video/*"></div></div>
<label>Description</label><textarea id="desc" class="field" rows="4" placeholder="Full product description..."></textarea>
<label>Product images (up to 10)</label><input id="images" class="field" type="file" accept="image/*" multiple>
<div class="small">Select up to 10 images. They will be stored in the order selected.</div>
<div id="status" class="status"></div><button class="btn primary" onclick="saveProduct()">ADD PRODUCT</button>
</div>
<div class="panel"><h2>Current Products</h2><div id="list" class="small">Loading...</div></div>
</div>
<script>
const ADMIN='@Zunaira317';
const CLOUD='kmhjx54f';
const PRESET='shopnexa';
const firebaseConfig={apiKey:'AIzaSyCRrpJnkNK8Tzw30bpi1seOZ-Noz_vLgFQ',authDomain:'shop-nexa-3665a.firebaseapp.com',projectId:'shop-nexa-3665a',storageBucket:'shop-nexa-3665a.appspot.com'};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function unlock(){if(document.getElementById('code').value!==ADMIN){document.getElementById('loginStatus').textContent='Wrong admin code';return}sessionStorage.setItem('shopnexa_admin','1');document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');loadProducts()}
if(sessionStorage.getItem('shopnexa_admin')==='1'){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');loadProducts()}
async function upload(file,type){const fd=new FormData();fd.append('file',file);fd.append('upload_preset',PRESET);const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/${type}/upload`,{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Cloudinary upload failed');return j.secure_url}
async function saveProduct(){const name=document.getElementById('name').value.trim(),price=Number(document.getElementById('price').value),category=document.getElementById('category').value,desc=document.getElementById('desc').value.trim(),files=[...document.getElementById('images').files].slice(0,10),videoFile=document.getElementById('video').files[0];const st=document.getElementById('status');if(!name||!price){st.textContent='Product name and price are required.';return}if(!files.length){st.textContent='Please select at least one product image.';return}try{const imgs=[];for(let i=0;i<files.length;i++){st.textContent=`Uploading image ${i+1}/${files.length}...`;imgs.push({number:i+1,url:await upload(files[i],'image')})}let video='';if(videoFile){st.textContent='Uploading video...';video=await upload(videoFile,'video')}st.textContent='Saving product...';await db.collection('products').add({name,price,category,description:desc,images:imgs,video,createdAt:Date.now()});st.textContent='Product added successfully.';document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('desc').value='';document.getElementById('images').value='';document.getElementById('video').value='';loadProducts()}catch(e){console.error(e);st.textContent=e.message||'Could not add product.'}}
async function loadProducts(){const el=document.getElementById('list');try{const snap=await db.collection('products').orderBy('createdAt','desc').get();if(snap.empty){el.innerHTML='No products yet.';return}el.innerHTML='';snap.forEach(doc=>{const p=doc.data(),d=document.createElement('div');d.className='row';const img=document.createElement('img');img.src=(p.images&&p.images[0]&&p.images[0].url)||p.image||'';const span=document.createElement('span');span.textContent=`${p.name||'Unnamed'} — PKR ${p.price||0} — ${p.category||''}`;const b=document.createElement('button');b.className='btn danger';b.textContent='DELETE';b.onclick=()=>deleteProduct(doc.id,p.name);d.append(img,span,b);el.appendChild(d)})}catch(e){el.textContent='Could not load products: '+e.message}}
async function deleteProduct(id,name){if(!confirm(`Delete ${name||'this product'}?`))return;try{await db.collection('products').doc(id).delete();loadProducts()}catch(e){alert('Delete failed: '+e.message)}}
</script>
</body></html>
