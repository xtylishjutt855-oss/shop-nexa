<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Nexa | Mikey Panel</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050608;color:#f5f7fa;font-family:Arial,sans-serif;padding:28px}.wrap{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.gold{color:#f4b400}.panel{background:#0d1015;border:1px solid #252b35;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 15px 50px #0008}label{display:block;color:#9299a6;font-size:12px;margin:12px 0 6px}input,select,textarea{width:100%;background:#080b0f;color:#fff;border:1px solid #303743;border-radius:9px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#f4b400}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:#f4b400;color:#090a0c}.danger{background:#321015;color:#ff9da8}.muted{color:#9299a6;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{margin-top:12px;font-size:12px}.progress{display:none;margin-top:10px;height:8px;background:#20252d;border-radius:6px;overflow:hidden}.progress-bar{height:100%;width:0;background:#f4b400;transition:width .15s}.image-row{display:grid;grid-template-columns:90px 1fr;gap:10px;margin-bottom:10px}.previews,.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview-wrap,.thumb-wrap{position:relative}.preview{width:100px;height:100px;object-fit:contain;background:#15191f;border:1px solid #303743;border-radius:10px}.preview-num,.num{position:absolute;left:5px;top:5px;background:#f4b400;color:#080a0d;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:12px;font-weight:900;z-index:2}.thumb{width:65px;height:65px;object-fit:contain;background:#15191f;border-radius:8px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #252b35;padding:14px 0}.item:first-child{border-top:0}.info{flex:1}.info b{display:block;margin-bottom:5px}.price{color:#f4b400;font-weight:800}.video-preview{display:none;width:100%;max-width:360px;margin-top:10px;border-radius:10px;background:#000}@media(max-width:650px){body{padding:15px}.grid{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start;gap:10px}.item{align-items:flex-start;flex-wrap:wrap}.image-row{grid-template-columns:70px 1fr}}</style></head>
<body><div class="wrap"><div class="head"><h1>SHOP <span class="gold">NEXA</span> <small class="muted">/ MIKEY</small></h1><a class="muted" href="./">← Store</a></div>
<div class="panel"><h2>Add Product</h2><p class="muted">Up to 6 images. You choose the number yourself. Video is optional.</p><div class="grid"><div><label>Product name</label><input id="name" placeholder="e.g. Airbuds Pro 2"></div><div><label>Price (PKR)</label><input id="price" type="number" placeholder="1299"></div><div><label>Category</label><select id="category"><option>Airbuds</option><option>Chargers</option><option>Data Cables</option><option>Mini Speakers</option><option>Mobile Accessories</option><option>Power Banks</option></select></div><div><label>Images (Maximum 6)</label><div id="imageInputs"><div class="image-row"><input class="number" type="number" min="1" max="6" placeholder="No."><input class="img-file" type="file" accept="image/*"></div></div><button type="button" class="btn" id="addImage">+ Add another image</button><div class="muted" style="margin-top:7px">Number khud enter karein (1–6). Same number allowed nahi.</div><div id="previews" class="previews"></div></div></div>
<label>Optional Product Video</label><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"><video id="videoPreview" class="video-preview" controls></video><div class="muted">Optional — MP4, WEBM ya MOV. Maximum 30 MB.</div>
<label>Description</label><textarea id="description" placeholder="Short product description"></textarea><div class="row" style="margin-top:15px"><button class="btn primary" id="add">+ Add Product</button><span id="status" class="status"></span></div><div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div></div>
<div class="panel"><h2>Products</h2><div id="list" class="muted">Loading...</div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCRrpJnkNK8Tzw30bpi1se0Z-Noz_vLgFQ",authDomain:"shop-nexa-3665a.firebaseapp.com",projectId:"shop-nexa-3665a",storageBucket:"shop-nexa-3665a.firebasestorage.app",messagingSenderId:"739818604866",appId:"1:739818604866:web:c87c85eb52ad48b2c660db",measurementId:"G-CMH520LW80"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),storage=firebase.storage(),products=db.collection('products');const $=id=>document.getElementById(id);function msg(t,ok=false){$('status').textContent=t;$('status').style.color=ok?'#78e08f':'#ff9da8'}function rows(){return Array.from(document.querySelectorAll('.image-row'))}
function refreshPreviews(){const p=$('previews');p.innerHTML='';rows().forEach(r=>{const f=r.querySelector('.img-file').files[0],n=r.querySelector('.number').value||'?';if(!f)return;const u=URL.createObjectURL(f),w=document.createElement('div');w.className='preview-wrap';w.innerHTML='<span class="preview-num">'+n+'</span><img class="preview">';w.querySelector('img').src=u;w.querySelector('img').onload=()=>URL.revokeObjectURL(u);p.appendChild(w)})}
function validateRows(){const rs=rows(),nums=[];if(!rs.length){msg('At least one image is required.');return false}for(const r of rs){const n=Number(r.querySelector('.number').value),f=r.querySelector('.img-file').files[0];if(!n||n<1||n>6){msg('Har image ka number 1 se 6 ke darmiyan dein.');return false}if(nums.includes(n)){msg('Image number '+n+' dobara use nahi ho sakta.');return false}nums.push(n);if(!f){msg('Har image row mein image select karein.');return false}if(!f.type.startsWith('image/')){msg('Please select image files only.');return false}if(f.size>10*1024*1024){msg('Each image maximum 10 MB ho sakti hai.');return false}}return true}
$('addImage').onclick=()=>{if(rows().length>=6){msg('Maximum 6 images allowed.');return}const d=document.createElement('div');d.className='image-row';d.innerHTML='<input class="number" type="number" min="1" max="6" placeholder="No."><input class="img-file" type="file" accept="image/*">';$('imageInputs').appendChild(d)};$('imageInputs').addEventListener('change',refreshPreviews);$('imageInputs').addEventListener('input',refreshPreviews);
$('videoFile').onchange=()=>{const f=$('videoFile').files[0];if(!f){$('videoPreview').style.display='none';return}if(!f.type.startsWith('video/')||f.size>30*1024*1024){msg('Video valid ho aur 30 MB se kam ho.');$('videoFile').value='';return}const u=URL.createObjectURL(f);$('videoPreview').src=u;$('videoPreview').style.display='block'};
function uploadFile(file,path,type,onProgress){return new Promise((resolve,reject)=>{const task=storage.ref(path).put(file,{contentType:type||file.type});task.on('state_changed',s=>onProgress&&onProgress(s.bytesTransferred,s.totalBytes),e=>reject(e),async()=>{try{resolve(await task.snapshot.ref.getDownloadURL())}catch(e){reject(e)}})})}
async function uploadImage(r,i,total,base){const n=Number(r.querySelector('.number').value),f=r.querySelector('.img-file').files[0];msg('Uploading image '+n+' of '+total+'...',true);const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');return{number:n,url:await uploadFile(f,'products/'+base+'_image_'+n+'_'+i+'_'+safe,f.type,(d,t)=>{const pct=t?Math.round(d/t*100):0;msg('Uploading image '+n+' — '+pct+'%',true)})}}
$('add').onclick=async()=>{const name=$('name').value.trim(),price=Number($('price').value),category=$('category').value,description=$('description').value.trim(),vf=$('videoFile').files[0];if(!name||!price){msg('Name and price are required.');return}if(!validateRows())return;if(vf&&(!vf.type.startsWith('video/')||vf.size>30*1024*1024)){msg('Video must be valid and under 30 MB.');return}const rs=rows().sort((a,b)=>Number(a.querySelector('.number').value)-Number(b.querySelector('.number').value)),base=Date.now();try{$('add').disabled=true;$('progress').style.display='block';$('progressBar').style.width='2%';msg('Starting upload...',true);let done=0;const results=await Promise.all(rs.map((r,i)=>uploadImage(r,i,rs.length,base).then(x=>{done++;$('progressBar').style.width=(done/rs.length*85)+'%';return x})));results.sort((a,b)=>a.number-b.number);const urls=results.map(x=>x.url);let videoUrl='';if(vf){msg('Uploading video...',true);videoUrl=await uploadFile(vf,'products/'+base+'_video_'+vf.name.replace(/[^a-zA-Z0-9._-]/g,'_'),vf.type,(d,t)=>{$('progressBar').style.width=(85+(t?d/t*14:0))+'%';msg('Uploading video — '+(t?Math.round(d/t*100):0)+'%',true)})}msg('Saving product...',true);await products.add({name,price,category,image:urls[0],images:urls,numberedImages:results,video:videoUrl,description,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$('progressBar').style.width='100%';msg('Product added successfully.',true);$('name').value='';$('price').value='';$('description').value='';$('videoFile').value='';$('imageInputs').innerHTML='<div class="image-row"><input class="number" type="number" min="1" max="6" placeholder="No."><input class="img-file" type="file" accept="image/*"></div>';$('previews').innerHTML='';$('videoPreview').pause();$('videoPreview').removeAttribute('src');$('videoPreview').style.display='none';load()}catch(e){msg('Upload failed: '+(e.code?e.code+' — ':'')+(e.message||e),false)}finally{$('add').disabled=false;setTimeout(()=>$('progress').style.display='none',1500)}};
async function load(){try{const s=await products.orderBy('createdAt','desc').limit(100).get();if(s.empty){$('list').textContent='No products yet.';return}$('list').innerHTML='';s.forEach(d=>{const p=d.data(),imgs=Array.isArray(p.numberedImages)&&p.numberedImages.length?p.numberedImages.slice().sort((a,b)=>Number(a.number)-Number(b.number)):((p.images||[p.image||'']).map((u,i)=>({number:i+1,url:u})));const el=document.createElement('div');el.className='item';const thumbs=document.createElement('div');thumbs.className='thumbs';imgs.slice(0,6).forEach(x=>{const w=document.createElement('div');w.className='thumb-wrap';w.innerHTML='<span class="num">'+x.number+'</span><img class="thumb">';w.querySelector('img').src=x.url;thumbs.appendChild(w)});const info=document.createElement('div');info.className='info';info.innerHTML='<b>'+esc(p.name||'Unnamed')+'</b><span class="muted">'+esc(p.category||'')+' · </span><span class="price">PKR '+Number(p.price||0).toLocaleString()+'</span><div class="muted">'+imgs.length+' image'+(imgs.length===1?'':'s')+(p.video?' · 🎬 Video':'')+'</div>';const b=document.createElement('button');b.className='btn danger';b.textContent='Delete';b.onclick=()=>del(d.id);el.append(thumbs,info,b);$('list').appendChild(el)})}catch(e){$('list').textContent='Products list unavailable: '+(e.code?e.code+' — ':'')+(e.message||e)}}
async function del(id){if(!confirm('Delete this product?'))return;try{await products.doc(id).delete();load()}catch(e){alert((e.code?e.code+' — ':'')+(e.message||e))}}function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}load();
</script></body></html>
