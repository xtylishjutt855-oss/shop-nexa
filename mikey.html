<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Nexa | Mikey Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050608;color:#f5f7fa;font-family:Arial,sans-serif;padding:28px}.wrap{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0}.gold{color:#f4b400}.panel{background:#0d1015;border:1px solid #252b35;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 15px 50px #0008}label{display:block;color:#9299a6;font-size:12px;margin:12px 0 6px}input,select,textarea{width:100%;background:#080b0f;color:#fff;border:1px solid #303743;border-radius:9px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#f4b400}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#f4b400;color:#090a0c}.danger{background:#321015;color:#ff9da8}.muted{color:#9299a6;font-size:12px}.row{display:flex;gap:10px;align-items:center}.status{margin-top:12px;font-size:12px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #252b35;padding:14px 0}.item:first-child{border-top:0}.thumb{width:65px;height:65px;object-fit:contain;background:#15191f;border-radius:8px}.info{flex:1}.info b{display:block;margin-bottom:5px}.price{color:#f4b400;font-weight:800}@media(max-width:650px){body{padding:15px}.grid{grid-template-columns:1fr}.head{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>SHOP <span class="gold">NEXA</span> <small class="muted">/ MIKEY</small></h1><a class="muted" href="./">← Store</a></div>
<div class="panel"><h2>Add Product</h2><p class="muted">Products are saved in the Firestore <b>products</b> collection.</p>
<div class="grid"><div><label>Product name</label><input id="name" placeholder="e.g. Airbuds Pro 2"></div><div><label>Price (PKR)</label><input id="price" type="number" placeholder="1299"></div><div><label>Category</label><select id="category"><option>Airbuds</option><option>Chargers</option><option>Data Cables</option><option>Mini Speakers</option><option>Mobile Accessories</option><option>Power Banks</option></select></div><div><label>Image URL</label><input id="image" placeholder="https://..."></div></div>
<label>Description</label><textarea id="description" placeholder="Short product description"></textarea>
<div class="row" style="margin-top:15px"><button class="btn primary" id="add">+ Add Product</button><span id="status" class="status"></span></div></div>
<div class="panel"><h2>Products</h2><div id="list" class="muted">Loading...</div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCRrpJnkNK8Tzw30bpi5seOZ-Noz_vLgFQ",authDomain:"shop-nexa-3665a.firebaseapp.com",projectId:"shop-nexa-3665a",storageBucket:"shop-nexa-3665a.appspot.com",messagingSenderId:"",appId:""};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const products=db.collection('products');
const $=id=>document.getElementById(id);function msg(t,ok=false){$('status').textContent=t;$('status').style.color=ok?'#78e08f':'#ff9da8'}
$('add').onclick=async()=>{const name=$('name').value.trim(),price=Number($('price').value),category=$('category').value,image=$('image').value.trim(),description=$('description').value.trim();if(!name||!price){msg('Name and price are required.');return}try{$('add').disabled=true;await products.add({name,price,category,image,description,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg('Product added successfully.',true);$('name').value='';$('price').value='';$('image').value='';$('description').value='';load()}catch(e){msg(e.message)}finally{$('add').disabled=false}};
async function load(){try{const s=await products.orderBy('createdAt','desc').limit(100).get();if(s.empty){$('list').textContent='No products yet.';return}$('list').innerHTML='';s.forEach(d=>{const p=d.data();const el=document.createElement('div');el.className='item';el.innerHTML=`<img class="thumb" src="${p.image||''}" onerror="this.style.visibility='hidden'"><div class="info"><b>${esc(p.name||'Unnamed')}</b><span class="muted">${esc(p.category||'')} · </span><span class="price">PKR ${Number(p.price||0).toLocaleString()}</span></div><button class="btn danger" onclick="del('${d.id}')">Delete</button>`;$('list').appendChild(el)})}catch(e){$('list').textContent='Could not load products: '+e.message}}
async function del(id){if(!confirm('Delete this product?'))return;try{await products.doc(id).delete();load()}catch(e){alert(e.message)}}function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}load();
</script></body></html>
