<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Nexa | Mikey Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050608;color:#f5f7fa;font-family:Arial,sans-serif;padding:28px}.wrap{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0}.gold{color:#f4b400}.panel{background:#0d1015;border:1px solid #252b35;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 15px 50px #0008}label{display:block;color:#9299a6;font-size:12px;margin:12px 0 6px}input,select,textarea{width:100%;background:#080b0f;color:#fff;border:1px solid #303743;border-radius:9px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#f4b400}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#f4b400;color:#090a0c}.danger{background:#321015;color:#ff9da8}.muted{color:#9299a6;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{margin-top:12px;font-size:12px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #252b35;padding:14px 0}.item:first-child{border-top:0}.thumbs{display:flex;gap:6px;flex-wrap:wrap;max-width:430px}.thumb-wrap{position:relative}.thumb{width:65px;height:65px;object-fit:contain;background:#15191f;border-radius:8px}.num{position:absolute;left:4px;top:4px;background:#f4b400;color:#080a0d;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:11px;font-weight:900}.info{flex:1}.info b{display:block;margin-bottom:5px}.price{color:#f4b400;font-weight:800}.image-row{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start;margin-bottom:10px}.image-row .number{font-weight:800}.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview-wrap{position:relative}.preview{width:100px;height:100px;object-fit:contain;background:#15191f;border:1px solid #303743;border-radius:10px;display:block}.preview-num{position:absolute;left:5px;top:5px;background:#f4b400;color:#080a0d;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:12px;font-weight:900}.video-preview{display:none;width:100%;max-width:360px;margin-top:10px;border-radius:10px;border:1px solid #303743;background:#000}.upload-note{margin-top:7px;font-size:11px;color:#727a86}@media(max-width:650px){body{padding:15px}.grid{grid-template-columns:1fr}.head{align-items:flex-start;gap:10px;flex-direction:column}.item{align-items:flex-start;flex-wrap:wrap}.thumb{width:55px;height:55px}.thumbs{max-width:100%}.image-row{grid-template-columns:70px 1fr}}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>SHOP <span class="gold">NEXA</span> <small class="muted">/ MIKEY</small></h1><a class="muted" href="./">← Store</a></div>
<div class="panel"><h2>Add Product</h2><p class="muted">Add up to 6 images. You choose the image number yourself. Optional product video is also available.</p>
<div class="grid"><div><label>Product name</label><input id="name" placeholder="e.g. Airbuds Pro 2"></div><div><label>Price (PKR)</label><input id="price" type="number" placeholder="1299"></div><div><label>Category</label><select id="category"><option>Airbuds</option><option>Chargers</option><option>Data Cables</option><option>Mini Speakers</option><option>Mobile Accessories</option><option>Power Banks</option></select></div><div><label>Images (Maximum 6)</label><div id="imageInputs"><div class="image-row"><input class="number" type="number" min="1" max="6" placeholder="No."><input class="img-file" type="file" accept="image/*"></div></div><button type="button" class="btn" id="addImage" style="margin-top:5px">+ Add another image</button><div class="upload-note">Aap har image ka number khud enter karein (1–6). Same number dobara allowed nahi.</div><div id="previews" class="previews"></div></div></div>
<label>Optional Product Video</label><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"><video id="videoPreview" class="video-preview" controls></video><div class="upload-note">Optional — MP4, WEBM ya MOV. Maximum 30 MB.</div>
<label>Description</label><textarea id="description" placeholder="Short product description"></textarea>
<div class="row" style="margin-top:15px"><button class="btn primary" id="add">+ Add Product</button><span id="status" class="status"></span></div></div>
<div class="panel"><h2>Products</h2><div id="list" class="muted">Loading...</div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCRrpJnkNK8Tzw30bpi1seOZ-Noz_vLgFQ",authDomain:"shop-nexa-3665a.firebaseapp.com",projectId:"shop-nexa-3665a",storageBucket:"shop-nexa-3665a.appspot.com",messagingSenderId:"",appId:""};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const storage=firebase.storage();const products=db.collection('products');
const $=id=>document.getElementById(id);function msg(t,ok=false){$('status').textContent=t;$('status').style.color=ok?'#78e08f':'#ff9da8'}
function rows(){return Array.from(document.querySelectorAll('.image-row'))}
function refreshPreviews(){const ps=$('previews');ps.innerHTML='';rows().forEach((row,i)=>{const f=row.querySelector('.img-file').files[0],n=row.querySelector('.number').value||'?';if(!f)return;const r=new FileReader();r.onload=e=>{const w=document.createElement('div');w.className='preview-wrap';const badge=document.createElement('span');badge.className='preview-num';badge.textContent=n;const img=document.createElement('img');img.className='preview';img.src=e.target.result;w.append(badge,img);ps.appendChild(w)};r.readAsDataURL(f)})}
function validateRows(){const rs=rows();if(rs.length<1){msg('At least one image is required.');return false}const nums=[];for(const row of rs){const n=Number(row.querySelector('.number').value),f=row.querySelector('.img-file').files[0];if(!n||n<1||n>6){msg('Har image ka number 1 se 6 ke darmiyan dein.');return false}if(nums.includes(n)){msg('Image number '+n+' dobara use nahi ho sakta.');return false}nums.push(n);if(!f){msg('Har image row mein image select karein.');return false}if(!f.type.startsWith('image/')){msg('Please select image files only.');return false}if(f.size>8*1024*1024){msg('Each image must be smaller than 8 MB.');return false}}return true}
$('addImage').onclick=()=>{if(rows().length>=6){msg('Maximum 6 images allowed.');return}const d=document.createElement('div');d.className='image-row';d.innerHTML='<input class="number" type="number" min="1" max="6" placeholder="No."><input class="img-file" type="file" accept="image/*">';$('imageInputs').appendChild(d);d.querySelector('.number').oninput=refreshPreviews;d.querySelector('.img-file').onchange=refreshPreviews};
$('imageInputs').addEventListener('input',refreshPreviews);$('imageInputs').addEventListener('change',refreshPreviews);
$('videoFile').onchange=()=>{const f=$('videoFile').files[0];if(!f){$('videoPreview').style.display='none';return}if(!f.type.startsWith('video/')){msg('Please select a video file.');$('videoFile').value='';return}if(f.size>30*1024*1024){msg('Video must be 30 MB or smaller.');$('videoFile').value='';$('videoPreview').style.display='none';return}const u=URL.createObjectURL(f);$('videoPreview').src=u;$('videoPreview').style.display='block'};
$('add').onclick=async()=>{const name=$('name').value.trim(),price=Number($('price').value),category=$('category').value,description=$('description').value.trim(),videoFile=$('videoFile').files[0];if(!name||!price){msg('Name and price are required.');return}if(!validateRows())return;if(videoFile&&( !videoFile.type.startsWith('video/') || videoFile.size>30*1024*1024)){msg('Video must be a valid video file under 30 MB.');return}try{$('add').disabled=true;const imageUrls=[];const imageNumbers=[];const rs=rows().sort((a,b)=>Number(a.querySelector('.number').value)-Number(b.querySelector('.number').value));for(let i=0;i<rs.length;i++){const row=rs[i],n=Number(row.querySelector('.number').value),file=row.querySelector('.img-file').files[0];msg('Uploading image '+n+'...',true);const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path='products/'+Date.now()+'_image_'+n+'_'+safeName;const ref=storage.ref(path);await ref.put(file);imageUrls.push(await ref.getDownloadURL());imageNumbers.push(n)}let videoUrl='';if(videoFile){msg('Uploading video...',true);const safeVideo=videoFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');const vref=storage.ref('products/'+Date.now()+'_video_'+safeVideo);await vref.put(videoFile);videoUrl=await vref.getDownloadURL()}const numberedImages=imageUrls.map((url,i)=>({number:imageNumbers[i],url}));msg('Saving product...',true);await products.add({name,price,category,image:imageUrls[0],images:imageUrls,numberedImages,video:videoUrl,description,createdAt:firebase.firestore.FieldValue.serverTimestamp()});msg('Product added successfully.',true);$('name').value='';$('price').value='';$('videoFile').value='';$('description').value='';$('imageInputs').innerHTML='<div class="image-row"><input class="number" type="number" min="1" max="6" placeholder="No."><input class="img-file" type="file" accept="image/*"></div>';$('previews').innerHTML='';$('videoPreview').pause();$('videoPreview').removeAttribute('src');$('videoPreview').style.display='none';load()}catch(e){msg(e.message)}finally{$('add').disabled=false}};
async function load(){try{const s=await products.orderBy('createdAt','desc').limit(100).get();if(s.empty){$('list').textContent='No products yet.';return}$('list').innerHTML='';s.forEach(d=>{const p=d.data();let imgs;if(Array.isArray(p.numberedImages)&&p.numberedImages.length){imgs=p.numberedImages.slice().sort((a,b)=>Number(a.number)-Number(b.number))}else{const old=Array.isArray(p.images)&&p.images.length?p.images:[p.image||''];imgs=old.map((url,i)=>({number:i+1,url}))}const el=document.createElement('div');el.className='item';const thumbs=document.createElement('div');thumbs.className='thumbs';imgs.slice(0,6).forEach(x=>{const w=document.createElement('div');w.className='thumb-wrap';const badge=document.createElement('span');badge.className='num';badge.textContent=x.number;const im=document.createElement('img');im.className='thumb';im.src=x.url;im.onerror=()=>im.style.visibility='hidden';w.append(badge,im);thumbs.appendChild(w)});const info=document.createElement('div');info.className='info';info.innerHTML='<b>'+esc(p.name||'Unnamed')+'</b><span class="muted">'+esc(p.category||'')+' · </span><span class="price">PKR '+Number(p.price||0).toLocaleString()+'</span><div class="muted" style="margin-top:5px">'+imgs.length+' image'+(imgs.length===1?'':'s')+(p.video?' · 🎬 Video':'')+'</div>';const delBtn=document.createElement('button');delBtn.className='btn danger';delBtn.textContent='Delete';delBtn.onclick=()=>del(d.id);el.append(thumbs,info,delBtn);$('list').appendChild(el)})}catch(e){$('list').textContent='Could not load products: '+e.message}}
async function del(id){if(!confirm('Delete this product?'))return;try{await products.doc(id).delete();load()}catch(e){alert(e.message)}}function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}load();
</script></body></html>
