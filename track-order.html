<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Order | Shop Nexa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#050608;--panel:#0d1015;--line:#252b35;--text:#f5f7fa;--muted:#9299a6;--gold:#f4b400;--gold2:#ffd45a;--green:#25d366}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#171c24 0,#080a0d 42%,#050608 100%);color:var(--text);font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(560px,100%)}.brand{text-align:center;margin-bottom:24px}.logo{width:54px;height:54px;margin:auto;border:1px solid #343b47;border-radius:16px;display:grid;place-items:center;background:#0d1117;box-shadow:0 0 30px #f4b40018}.logo i{font-size:25px;color:var(--gold)}h1{font-size:28px;margin:12px 0 5px}.brand p{color:var(--muted);font-size:12px;margin:0}
.card{background:linear-gradient(145deg,#11161d,#090c11);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 30px 90px #0009}.label{font-size:10px;font-weight:900;letter-spacing:1px;color:#c8ced7}.search{display:flex;gap:8px;margin-top:8px}.search input{flex:1;background:#070a0e;color:#fff;border:1px solid #303743;border-radius:10px;padding:13px;outline:0;text-transform:uppercase}.search input:focus{border-color:var(--gold)}button{border:0;border-radius:10px;padding:0 18px;background:var(--gold);color:#08090b;font-weight:900;cursor:pointer}.hint{font-size:9px;color:#69717e;margin-top:8px}.status{margin-top:22px}.hidden{display:none}.result-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}.order-no{font-size:12px;color:var(--gold);font-weight:900}.badge{padding:6px 10px;border-radius:999px;background:#161b22;color:#f4b400;font-size:9px;font-weight:900;text-transform:uppercase}.progress{display:grid;grid-template-columns:repeat(4,1fr);margin:24px 0 12px;position:relative}.progress:before{content:"";position:absolute;left:12%;right:12%;top:12px;height:2px;background:#252b35}.step{position:relative;text-align:center;z-index:1}.dot{width:26px;height:26px;margin:auto;border-radius:50%;background:#151a20;border:2px solid #303743;display:grid;place-items:center;font-size:10px;color:#69717e}.step.active .dot{background:var(--gold);border-color:var(--gold);color:#08090b}.step.done .dot{background:#25d366;border-color:#25d366;color:#041008}.step span{display:block;margin-top:8px;font-size:8px;color:#69717e}.step.active span,.step.done span{color:#fff}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.info div{background:#080b0f;border:1px solid #202630;border-radius:10px;padding:12px}.info small{display:block;color:#69717e;font-size:8px;margin-bottom:5px}.info b{font-size:11px;word-break:break-word}.items{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.item{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:10px}.total{text-align:right;border-top:1px solid var(--line);margin-top:5px;padding-top:12px;font-weight:900;color:var(--gold)}.error{margin-top:16px;background:#190d0d;border:1px solid #4a2222;color:#ff9b9b;padding:11px;border-radius:9px;font-size:10px}.loading{color:var(--muted);font-size:10px;text-align:center;padding:15px}.back{display:block;text-align:center;color:#777f8c;font-size:10px;margin-top:18px}.back:hover{color:var(--gold)}@media(max-width:500px){.card{padding:18px}.search button{padding:0 13px}.progress:before{left:13%;right:13%}.info{grid-template-columns:1fr}.step span{font-size:7px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo"><i class="fa-solid fa-cart-shopping"></i></div><h1>Track Your Order</h1><p>Shop Nexa — Order tracking</p></div>
  <div class="card">
    <div class="label">ORDER ID</div>
    <div class="search"><input id="orderId" maxlength="30" placeholder="Enter your order ID"><button onclick="trackOrder()">TRACK</button></div>
    <div class="hint">Enter the Order # shown after placing your order. The last 6 characters are enough.</div>
    <div id="status"></div>
    <div id="result" class="status hidden"></div>
  </div>
  <a class="back" href="index.html">← Back to Shop Nexa</a>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyCRrpJnkNK8Tzw30bpi9seOZ-Noz_vLgFQ',authDomain:'shop-nexa-3665a.firebaseapp.com',projectId:'shop-nexa-3665a',storageBucket:'shop-nexa-3665a.appspot.com'};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>Number(v||0).toLocaleString('en-PK');
function statusKey(s){s=String(s||'new').toLowerCase();if(['completed','delivered'].includes(s))return 3;if(['shipped','out for delivery'].includes(s))return 2;if(['processing','confirmed'].includes(s))return 1;return 0}
function renderOrder(o){
 const key=statusKey(o.status), labels=['Order Placed','Processing','Shipped','Completed'];
 const steps=labels.map((x,i)=>'<div class="step '+(i<key?'done ':i===key?'active ':'')+'"><div class="dot"><i class="fa-solid '+(i<key?'fa-check':i===0?'fa-receipt':i===1?'fa-box':'fa-truck')+'"></i></div><span>'+x+'</span></div>').join('');
 const items=(o.items||[]).map(x=>'<div class="item"><span>'+esc(x.name)+' ×'+esc(x.quantity||1)+'</span><b>PKR '+money(x.price)+'</b></div>').join('');
 const date=o.createdAt?new Date(o.createdAt).toLocaleString('en-PK',{dateStyle:'medium',timeStyle:'short'}):'—';
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('result').innerHTML='<div class="result-head"><div class="order-no">ORDER #'+esc(o.id.slice(-6).toUpperCase())+'</div><div class="badge">'+esc(o.status||'new')+'</div></div><div class="progress">'+steps+'</div><div class="info"><div><small>CUSTOMER</small><b>'+esc(o.customerName||'—')+'</b></div><div><small>DATE</small><b>'+esc(date)+'</b></div><div><small>CITY</small><b>'+esc(o.city||'—')+'</b></div><div><small>TOTAL</small><b>PKR '+money(o.total)+'</b></div></div><div class="items">'+items+'<div class="total">Total: PKR '+money(o.total)+'</div></div>';
}
async function trackOrder(){
 const q=document.getElementById('orderId').value.trim().toLowerCase().replace(/^#/,'');
 const st=document.getElementById('status'),res=document.getElementById('result');res.classList.add('hidden');if(!q)return st.innerHTML='<div class="error">Please enter your Order ID.</div>';
 st.innerHTML='<div class="loading">Searching for your order...</div>';
 try{
   const snap=await db.collection('orders').limit(200).get();
   const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
   const o=docs.find(x=>x.id.toLowerCase()===q||x.id.toLowerCase().endsWith(q)||String(x.shortOrderId||'').toLowerCase()===q);
   if(!o)throw new Error('Order not found');
   st.innerHTML='';renderOrder(o);
 }catch(e){console.error(e);st.innerHTML='<div class="error">'+(e.message==='Order not found'?'Order not found. Please check your Order ID.':'Could not load order. Please try again.')+'</div>'}
}
document.getElementById('orderId').addEventListener('keydown',e=>{if(e.key==='Enter')trackOrder()});
</script>
</body>
</html>
