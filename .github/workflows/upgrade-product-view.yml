name: Upgrade Product View

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-product-view.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, 'Apply upgraded product view') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject premium product view
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SHOPNEXA_PREMIUM_PRODUCT_VIEW_V3 -->'
          if marker in s:
              print('Premium product view already installed')
              raise SystemExit(0)
          css=r'''<style id="sn-product-v3-css">
          /* SHOPNEXA_PREMIUM_PRODUCT_VIEW_V3 */
          #snProductV3{position:fixed;inset:0;z-index:10000;background:#050608;color:#f5f7fa;overflow:auto;display:none}
          #snProductV3.show{display:block;animation:snv3In .28s ease}
          @keyframes snv3In{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
          .snv3-shell{min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(244,180,0,.08),transparent 28%),linear-gradient(180deg,#080a0d,#050608 55%,#030405)}
          .snv3-top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #242a33;background:rgba(5,6,8,.9);backdrop-filter:blur(18px);position:sticky;top:0;z-index:4}
          .snv3-brand{font-size:12px;font-weight:900;letter-spacing:3px;color:#f4b400}.snv3-close{width:42px;height:42px;border:1px solid #303640;border-radius:12px;background:#101319;color:#fff;font-size:22px}.snv3-close:hover{border-color:#f4b400;color:#f4b400}
          .snv3-main{max-width:1380px;margin:auto;padding:42px 5% 70px}.snv3-breadcrumb{font-size:10px;color:#777f8c;letter-spacing:1px;margin-bottom:22px}.snv3-breadcrumb b{color:#f4b400}
          .snv3-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(380px,.88fr);gap:58px;align-items:start}
          .snv3-gallery{position:sticky;top:92px}.snv3-hero{height:min(62vw,650px);min-height:430px;background:linear-gradient(145deg,#11151b,#080a0d);border:1px solid #272e38;border-radius:28px;position:relative;display:grid;place-items:center;overflow:hidden;box-shadow:0 35px 100px rgba(0,0,0,.45)}
          .snv3-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.045),transparent 48%);pointer-events:none}.snv3-hero img{width:92%;height:92%;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 25px 35px rgba(0,0,0,.55));transition:opacity .18s,transform .25s}.snv3-hero img.sn-fade{opacity:.2;transform:scale(.98)}
          .snv3-arrow{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid #343b46;background:rgba(5,6,8,.8);color:#fff}.snv3-arrow:hover{border-color:#f4b400;color:#f4b400}.snv3-prev{left:18px}.snv3-next{right:18px}.snv3-count{position:absolute;right:18px;top:18px;z-index:2;background:#080a0dcc;border:1px solid #303640;border-radius:20px;padding:8px 12px;font-size:10px;color:#c8ced7}
          .snv3-thumbs{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding:2px 2px 8px}.snv3-thumb{flex:0 0 78px;height:78px;border-radius:13px;border:1px solid #282f39;background:#0d1015;overflow:hidden;padding:0}.snv3-thumb img{width:100%;height:100%;object-fit:contain}.snv3-thumb.active{border:2px solid #f4b400;box-shadow:0 0 0 3px rgba(244,180,0,.1)}
          .snv3-info{padding:8px 0}.snv3-kicker{font-size:10px;color:#f4b400;font-weight:900;letter-spacing:3px}.snv3-title{font-size:clamp(30px,3.4vw,50px);line-height:1.06;margin:12px 0 16px;letter-spacing:-1.4px}.snv3-rating{display:flex;align-items:center;gap:10px;color:#f4b400;font-size:12px;margin-bottom:22px}.snv3-rating span{color:#7f8794}.snv3-price-row{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}.snv3-price{font-size:31px;font-weight:950;color:#fff}.snv3-old{text-decoration:line-through;color:#69717e;font-size:14px}.snv3-sale{font-size:9px;font-weight:900;background:#1b1606;color:#f4b400;border:1px solid #4b3a0b;padding:5px 8px;border-radius:6px}.snv3-divider{height:1px;background:#242a33;margin:25px 0}.snv3-desc{color:#aab2bf;line-height:1.8;font-size:13px}.snv3-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.snv3-meta>div{background:#0d1116;border:1px solid #252c36;border-radius:12px;padding:13px 10px}.snv3-meta i{color:#f4b400;margin-right:6px}.snv3-meta b{display:block;font-size:9px;margin-top:7px}.snv3-meta span{font-size:8px;color:#707987}
          .snv3-buy{display:grid;grid-template-columns:110px 1fr 1fr;gap:9px;margin:18px 0}.snv3-qty{display:flex;border:1px solid #303742;border-radius:11px;overflow:hidden;background:#0b0e12}.snv3-qty button{width:34px;border:0;background:transparent;color:#fff}.snv3-qty span{flex:1;display:grid;place-items:center;font-weight:900;font-size:12px}.snv3-add,.snv3-wa{border:0;border-radius:11px;font-weight:900;font-size:10px;letter-spacing:.5px}.snv3-add{background:#f4b400;color:#08090b}.snv3-wa{background:#10351f;border:1px solid #1e6b3b;color:#63e58f}.snv3-add:hover{background:#ffd45a}.snv3-wa:hover{background:#164c2b}.snv3-note{text-align:center;color:#68717e;font-size:9px;margin:12px 0 26px}.snv3-sections{border-top:1px solid #252c35}.snv3-section{border-bottom:1px solid #252c35}.snv3-section button{width:100%;padding:18px 2px;background:transparent;border:0;color:#fff;text-align:left;display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:1px}.snv3-section .body{display:none;color:#929aa7;font-size:11px;line-height:1.8;padding:0 2px 18px}.snv3-section.open .body{display:block}.snv3-section.open button i{transform:rotate(180deg)}
          .snv3-bottom{max-width:1380px;margin:0 auto;padding:0 5% 55px}.snv3-bottom-card{background:#0b0e13;border:1px solid #252c35;border-radius:22px;padding:28px}.snv3-bottom-card h3{margin:0 0 10px;font-size:18px}.snv3-bottom-card p{color:#858e9b;font-size:11px;line-height:1.8;margin:0}.snv3-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#f4b400;color:#07080a;padding:12px 18px;border-radius:10px;font-size:10px;font-weight:900;z-index:11000;transition:.2s}.snv3-toast.show{opacity:1;transform:translate(-50%,0)}
          @media(max-width:900px){.snv3-grid{grid-template-columns:1fr;gap:28px}.snv3-gallery{position:static}.snv3-hero{height:65vw;min-height:360px}.snv3-info{padding:0}.snv3-title{font-size:34px}}
          @media(max-width:560px){.snv3-top{height:60px;padding:0 4%}.snv3-main{padding:24px 4% 50px}.snv3-hero{height:92vw;min-height:300px;border-radius:20px}.snv3-arrow{width:38px;height:38px}.snv3-prev{left:10px}.snv3-next{right:10px}.snv3-thumbs{gap:7px}.snv3-thumb{flex-basis:62px;height:62px}.snv3-title{font-size:29px}.snv3-meta{grid-template-columns:1fr 1fr}.snv3-meta>div:last-child{grid-column:1/-1}.snv3-buy{grid-template-columns:100px 1fr}.snv3-wa{grid-column:1/-1;height:48px}.snv3-add{height:48px}.snv3-qty{height:48px}}
          </style>'''
          js=r'''<script id="sn-product-v3-js">
          (function(){
            function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
            function imgs(p){
              if(typeof window.imageList==='function'){const a=window.imageList(p);if(a&&a.length)return a}
              const a=Array.isArray(p.images)?p.images:[];let out=a.map(x=>typeof x==='string'?x:x&&x.url).filter(Boolean);if(p.image)out.push(p.image);return [...new Set(out)]
            }
            function money(n){return Number(n||0).toLocaleString('en-PK')}
            function openV3(id){
              const p=(window.products||[]).find(x=>String(x.id)===String(id)); if(!p)return;
              const im=imgs(p); let idx=0,qty=1;
              let root=document.getElementById('snProductV3'); if(root)root.remove();
              root=document.createElement('div');root.id='snProductV3';root.innerHTML=`<div class="snv3-shell"><header class="snv3-top"><div class="snv3-brand">SHOP NEXA / PRODUCT</div><button class="snv3-close" aria-label="Close">×</button></header><main class="snv3-main"><div class="snv3-breadcrumb">HOME / PRODUCTS / <b>${esc(p.category||'TECH')}</b></div><div class="snv3-grid"><div class="snv3-gallery"><div class="snv3-hero"><span class="snv3-count"></span><button class="snv3-arrow snv3-prev">‹</button><img class="snv3-mainimg" alt="${esc(p.name)}"><button class="snv3-arrow snv3-next">›</button></div><div class="snv3-thumbs"></div></div><div class="snv3-info"><div class="snv3-kicker">SHOP NEXA ORIGINAL</div><h1 class="snv3-title">${esc(p.name||'Premium Product')}</h1><div class="snv3-rating">★★★★★ <span>Premium Tech • Verified Product</span></div><div class="snv3-price-row"><strong class="snv3-price">PKR ${money(p.price)}</strong>${p.oldPrice?`<span class="snv3-old">PKR ${money(p.oldPrice)}</span>`:''}${p.discount?`<span class="snv3-sale">${esc(p.discount)} OFF</span>`:''}</div><div class="snv3-divider"></div><div class="snv3-desc">${esc(p.description||'Premium quality product from Shop Nexa. Fast delivery all over Pakistan.')}</div><div class="snv3-meta"><div><i class="fa-solid fa-truck-fast"></i><b>FAST DELIVERY</b><span>All over Pakistan</span></div><div><i class="fa-solid fa-money-bill-wave"></i><b>CASH ON DELIVERY</b><span>Available</span></div><div><i class="fa-solid fa-shield-halved"></i><b>QUALITY CHECK</b><span>Before dispatch</span></div></div><div class="snv3-buy"><div class="snv3-qty"><button class="qminus">−</button><span class="qnum">1</span><button class="qplus">+</button></div><button class="snv3-add"><i class="fa-solid fa-cart-plus"></i> ADD TO CART</button><button class="snv3-wa"><i class="fa-brands fa-whatsapp"></i> ORDER ON WHATSAPP</button></div><div class="snv3-note">Secure ordering • Genuine product listing • Fast response on WhatsApp</div><div class="snv3-sections"><div class="snv3-section open"><button>DESCRIPTION <i class="fa-solid fa-chevron-down"></i></button><div class="body">${esc(p.description||'Product details will be updated soon.')}</div></div><div class="snv3-section"><button>SPECIFICATIONS <i class="fa-solid fa-chevron-down"></i></button><div class="body">${esc(p.specifications||p.specs||'Specifications are shown here when provided by the product listing.')}${p.sku?`<br><br><b>SKU:</b> ${esc(p.sku)}`:''}</div></div><div class="snv3-section"><button>DELIVERY &amp; RETURNS <i class="fa-solid fa-chevron-down"></i></button><div class="body">Cash on Delivery is available where supported. Delivery time depends on destination. Contact Shop Nexa on WhatsApp for order updates and return/exchange guidance.</div></div></div></div></div></main><div class="snv3-bottom"><div class="snv3-bottom-card"><h3>Shop with confidence</h3><p>Need help before ordering? Contact Shop Nexa on WhatsApp and confirm product availability, color and delivery details.</p></div></div></div><div class="snv3-toast">Added to cart</div>`;
              document.body.appendChild(root);root.classList.add('show');document.body.style.overflow='hidden';
              const main=root.querySelector('.snv3-mainimg'),thumbs=root.querySelector('.snv3-thumbs'),count=root.querySelector('.snv3-count');
              function render(){const u=im[idx]||'';main.classList.add('sn-fade');setTimeout(()=>{main.src=u;main.classList.remove('sn-fade')},80);count.textContent=`${im.length?idx+1:0} / ${im.length}`;thumbs.innerHTML=im.map((u,i)=>`<button class="snv3-thumb ${i===idx?'active':''}" data-i="${i}"><img src="${esc(u)}" alt="Image ${i+1}"></button>`).join('')}
              render();
              root.querySelector('.snv3-close').onclick=()=>{root.remove();document.body.style.overflow=''};
              root.querySelector('.snv3-prev').onclick=()=>{if(im.length){idx=(idx-1+im.length)%im.length;render()}};root.querySelector('.snv3-next').onclick=()=>{if(im.length){idx=(idx+1)%im.length;render()}};
              thumbs.onclick=e=>{const b=e.target.closest('[data-i]');if(b){idx=Number(b.dataset.i);render()}};
              root.querySelector('.qminus').onclick=()=>{qty=Math.max(1,qty-1);root.querySelector('.qnum').textContent=qty};root.querySelector('.qplus').onclick=()=>{qty++;root.querySelector('.qnum').textContent=qty};
              root.querySelector('.snv3-add').onclick=()=>{try{if(typeof window.addToCart==='function'){for(let i=0;i<qty;i++)window.addToCart(p.id)}else if(typeof window.addCart==='function'){for(let i=0;i<qty;i++)window.addCart(p.id)}else{const key='shopnexa_cart';const c=JSON.parse(localStorage.getItem(key)||'[]');for(let i=0;i<qty;i++)c.push(p);localStorage.setItem(key,JSON.stringify(c))}root.querySelector('.snv3-toast').classList.add('show');setTimeout(()=>root.querySelector('.snv3-toast').classList.remove('show'),1600)}catch(e){console.error(e)}};
              root.querySelector('.snv3-wa').onclick=()=>{const text=`Assalam-o-Alaikum Shop Nexa, I want to order:\n\nProduct: ${p.name}\nPrice: PKR ${money(p.price)}\nQuantity: ${qty}\n\nPlease confirm availability and delivery.`;window.open('https://wa.me/923274670280?text='+encodeURIComponent(text),'_blank')};
              root.querySelectorAll('.snv3-section>button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
              root.addEventListener('keydown',e=>{if(e.key==='Escape')root.querySelector('.snv3-close').click();if(e.key==='ArrowLeft')root.querySelector('.snv3-prev').click();if(e.key==='ArrowRight')root.querySelector('.snv3-next').click()});
            }
            window.openProduct=openV3;
          })();
          </script>'''
          insert=css+'\n'+js
          s=s.replace('</head>',insert+'</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Installed V3 product view')
          PY

      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'shopnexa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply upgraded product view'
          git push
