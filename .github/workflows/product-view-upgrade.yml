name: Shop Nexa Product View Deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach final product view
        shell: bash
        run: |
          if grep -q 'product-view-v4.js' index.html; then
            echo 'Product view already attached'
            exit 0
          fi
          sed -i 's#</head>#<script src="product-view-v4.js"></script></head>#' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Attach final product view'
          git push
