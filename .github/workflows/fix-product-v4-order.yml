name: Fix Product View Script Order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move product view script after site functions
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="product-view-v4.js"></script>'
          if tag in s:
              s = s.replace(tag, '', 1)
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix product view script load order'
          git push
