name: Shop Nexa final UI fixes

on:
  push:
    paths:
      - '.github/workflows/shop-nexa-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Modern, clean product photos for the two category cards.
          data_cable='https://static.wixstatic.com/media/6469df_c8f9fc9dd42345eca807733bab164073~mv2.jpg/v1/fill/w_520%2Ch_578%2Cal_c%2Cq_80%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/6469df_c8f9fc9dd42345eca807733bab164073~mv2.jpg'
          power_bank='https://www.itsajten.se/uploads/products/en-kraftfull-och-flexibel-portabel-laddare-med-2x-USB-A-po_14988_6.jpg'
          for old in [
            'https://share.google/tx91oPD8BNhxSzGO3',
            'https://commons.wikimedia.org/wiki/Special:FilePath/USB-cable.jpg',
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/USB-cable.jpg'
          ]: s=s.replace(old,data_cable)
          for old in [
            'https://share.google/ULHzIW6BzUqW0m6pi',
            'https://commons.wikimedia.org/wiki/Special:FilePath/USB_power_bank.jpg',
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/USB%20power%20bank.jpg'
          ]: s=s.replace(old,power_bank)

          # Firestore products can contain images as either {url,number} objects OR plain URL strings.
          old="function imageList(p){return (Array.isArray(p.images)?p.images:[]).slice().sort((a,b)=>(Number(a.number)||0)-(Number(b.number)||0)).map(x=>x.url).filter(Boolean).concat(p.image?[p.image]:[])}"
          new="function imageList(p){const a=Array.isArray(p.images)?p.images:[];const out=a.map((x,i)=>typeof x==='string'?{url:x,number:i+1}:x).filter(x=>x&&x.url).sort((a,b)=>(Number(a.number)||0)-(Number(b.number)||0)).map(x=>x.url);if(p.image)out.push(p.image);return [...new Set(out)]}"
          s=s.replace(old,new)

          # Add visible gallery thumbnails for ALL product images in fullscreen and allow clicking them.
          marker="<div class=\"sn-photo\">${image?`<img src=\"${esc(image)}\" alt=\"${esc(p.name)}\" onerror=\"this.style.display='none'\">`:'<i class=\"fa-solid fa-box\" style=\"font-size:90px;color:#333\"></i>'}</div>"
          replacement=marker+"<div class=\"sn-thumbs\">${imgs.map((u,i)=>`<img src=\"${esc(u)}\" alt=\"Image ${i+1}\" onclick=\"document.getElementById('snMainProductImage').src='${esc(u)}'\">`).join('')}</div>"
          s=s.replace(marker,replacement)
          s=s.replace('<img src="${esc(image)}" alt="${esc(p.name)}" onerror="this.style.display=\'none\'">','<img id="snMainProductImage" src="${esc(image)}" alt="${esc(p.name)}" onerror="this.style.display=\'none\'">')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use modern category product photos"
          git push
