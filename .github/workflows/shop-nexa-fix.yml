name: Shop Nexa final UI fixes

on:
  push:
    paths:
      - '.github/workflows/shop-nexa-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Reliable category images with browser fallback.
          data='https://commons.wikimedia.org/wiki/Special:Redirect/file/USB-cable.jpg'
          power='https://commons.wikimedia.org/wiki/Special:Redirect/file/USB%20power%20bank.jpg'
          data_fallback='https://images.unsplash.com/photo-1544724569-5f546fd6f2b5?w=700&q=85'
          power_fallback='https://images.unsplash.com/photo-1609592424748-0d2d8a8b4f8b?w=700&q=85'
          s=re.sub(r'(<div class="category" onclick="filterCat\(\'Data Cables\'\)"><div class="cat-img"><img src=")[^"]+(" alt="Data cables"[^>]*>)', r'\g<1>'+data+r'\g<2>', s, count=1)
          s=re.sub(r'(<div class="category" onclick="filterCat\(\'Power Banks\'\)"><div class="cat-img"><img src=")[^"]+(" alt="Power banks"[^>]*>)', r'\g<1>'+power+r'\g<2>', s, count=1)
          s=s.replace('alt="Data cables">','alt="Data cables" onerror="this.onerror=null;this.src=\''+data_fallback+'\'">')
          s=s.replace('alt="Power banks">','alt="Power banks" onerror="this.onerror=null;this.src=\''+power_fallback+'\'">')

          # Expose the module-local products array to the fullscreen click handler.
          s=s.replace("products=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));renderProducts(products);", "products=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));window.products=products;window.db=db;renderProducts(products);")

          # Replace the fragile fullscreen override with a direct handler that always uses window.products.
          start=s.find('<script>\n(function(){\n  function esc(v){return String(v??')
          if start!=-1:
              end=s.find('</script>',start)
              if end!=-1:
                  end+=len('</script>')
                  js='''<script>\n(function(){\n  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}\n  window.openProduct=function(id){\n    const p=(window.products||[]).find(x=>x.id===id);\n    if(!p)return;\n    const imgs=(Array.isArray(p.images)?p.images:[]).slice().sort((a,b)=>(Number(a.number)||0)-(Number(b.number)||0)).map(x=>x.url).filter(Boolean);\n    const image=imgs[0]||p.image||'';\n    const old=document.getElementById('snFullProduct');if(old)old.remove();\n    const m=document.createElement('div');m.id='snFullProduct';m.className='modal show sn-fullscreen';\n    m.innerHTML=`<button class="close sn-close" onclick="document.getElementById('snFullProduct').remove()">×</button><div class="sn-product-wrap"><div class="sn-photo">${image?`<img src="${esc(image)}" alt="${esc(p.name)}" onerror="this.style.display='none'">`:'<i class="fa-solid fa-box" style="font-size:90px;color:#333"></i>'}</div><div class="sn-info"><div class="eyebrow">SHOP NEXA</div><h2>${esc(p.name)}</h2><div class="sn-price">PKR ${Number(p.price||0).toLocaleString('en-PK')}</div><div class="sn-cod"><i class="fa-solid fa-money-bill-wave"></i> Cash on Delivery Available</div><div class="sn-desc">${esc(p.description||'Quality product from Shop Nexa. Fast delivery all over Pakistan.')}</div><button class="sn-order" onclick="orderProduct('${p.id}')"><i class="fa-brands fa-whatsapp"></i> ORDER NOW</button></div></div>`;\n    document.body.appendChild(m);\n  };\n})();\n</script>'''
                  s=s[:start]+js+s[end:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix product click bridge and category image fallbacks"
          git push
