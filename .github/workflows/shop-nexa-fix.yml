name: Shop Nexa final UI fixes

on:
  push:
    paths:
      - '.github/workflows/shop-nexa-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Keep category images as direct working image URLs.
          s=s.replace('https://share.google/tx91oPD8BNhxSzGO3','https://commons.wikimedia.org/wiki/Special:FilePath/USB-cable.jpg')
          s=s.replace('https://share.google/ULHzIW6BzUqW0m6pi','https://commons.wikimedia.org/wiki/Special:FilePath/USB_power_bank.jpg')
          s=s.replace('https://commons.wikimedia.org/wiki/Special:Redirect/file/USB-cable.jpg','https://commons.wikimedia.org/wiki/Special:FilePath/USB-cable.jpg')
          s=s.replace('https://commons.wikimedia.org/wiki/Special:Redirect/file/USB%20power%20bank.jpg','https://commons.wikimedia.org/wiki/Special:FilePath/USB_power_bank.jpg')

          # Support both Firestore image formats: objects and plain URL strings.
          old="function imageList(p){return (Array.isArray(p.images)?p.images:[]).slice().sort((a,b)=>(Number(a.number)||0)-(Number(b.number)||0)).map(x=>x.url).filter(Boolean).concat(p.image?[p.image]:[])}"
          new="function imageList(p){const a=Array.isArray(p.images)?p.images:[];const out=a.map((x,i)=>typeof x==='string'?{url:x,number:i+1}:x).filter(x=>x&&x.url).sort((a,b)=>(Number(a.number)||0)-(Number(b.number)||0)).map(x=>x.url);if(p.image)out.push(p.image);return [...new Set(out)]}"
          s=s.replace(old,new)

          # The premium gallery must keep the thumbnail strip under the main image,
          # not as a third grid column. Also make every uploaded image selectable.
          old2='const imgs=(Array.isArray(p.images)?p.images:[]).slice().sort((a,b)=>(Number(a.number)||0)-(Number(b.number)||0)).map(x=>x.url).filter(Boolean);'
          new2='const rawImgs=Array.isArray(p.images)?p.images:[];const imgs=rawImgs.map((x,i)=>typeof x===\'string\'?x:x&&x.url).filter(Boolean);if(p.image)imgs.push(p.image);'
          s=s.replace(old2,new2)
          s=s.replace('<div class="sn-product-wrap"><div class="sn-photo">','<div class="sn-product-wrap"><div class="sn-media-column"><div class="sn-photo">')
          s=s.replace('</div><div class="sn-info"><div class="eyebrow">SHOP NEXA</div>','</div></div><div class="sn-info"><div class="eyebrow">SHOP NEXA</div>')
          s=s.replace('<img src="${esc(image)}" alt="${esc(p.name)}" onerror="this.style.display=\'none\'">','<img id="snMainProductImage" src="${esc(image)}" alt="${esc(p.name)}" onerror="this.style.display=\'none\'">')

          # Make product-card and fullscreen images show the complete uploaded image.
          style='''
          <style id="sn-full-image-fix">
          .product-image{padding:10px!important;background:#0c1015!important}
          .product-image img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;padding:4px!important}
          .sn-fullscreen .sn-media-column{min-width:0;width:100%}
          .sn-fullscreen .sn-photo{width:100%!important;height:min(65vh,640px)!important;min-height:360px!important;padding:18px!important;box-sizing:border-box!important}
          .sn-fullscreen .sn-photo img{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:contain!important;object-position:center!important;padding:0!important}
          .sn-fullscreen .sn-thumbs{width:100%!important;display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;justify-content:flex-start!important}
          .sn-fullscreen .sn-thumbs img{flex:0 0 auto!important;object-fit:contain!important;object-position:center!important}
          @media(max-width:800px){.sn-fullscreen .sn-photo{height:48vh!important;min-height:280px!important;padding:12px!important}.sn-fullscreen .sn-media-column{width:100%!important}}
          </style>'''
          if 'id="sn-full-image-fix"' not in s:
              s=s.replace('</head>',style+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix complete product image display"
          git push
